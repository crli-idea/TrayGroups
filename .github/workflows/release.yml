name: Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.ref_type == 'tag' ||
      (github.ref == 'refs/heads/main' &&
       github.event.head_commit.message == 'Add automatic GitHub release workflow')
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib

      - name: Build TrayGroups
        shell: pwsh
        run: .\build.ps1

      - name: Test screenshot module
        shell: pwsh
        run: .\ScreenCaptureTimer\test\run.ps1

      - name: Package portable binaries
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'traygroups-release'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item test\build\TrayGroups.exe, README.md -Destination $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "test\build\TrayGroups-$env:RELEASE_TAG-windows-x64.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TrayGroups ${{ env.RELEASE_TAG }}
          body: |
            Portable Windows release with TrayGroups grouping and scheduled multi-monitor capture in one executable.

            Configuration and screenshot output stay beside the executable. Extract it to a writable folder before running.
          files: test/build/TrayGroups-${{ env.RELEASE_TAG }}-windows-x64.zip
          fail_on_unmatched_files: true
          make_latest: true
