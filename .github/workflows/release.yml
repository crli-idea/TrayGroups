name: Windows Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib

      - name: Build TrayGroups
        shell: pwsh
        run: .\build.ps1

      - name: Test screenshot module
        shell: pwsh
        run: .\test\capture\run.ps1

      - name: Test config and identity modules
        shell: pwsh
        run: .\test\core-modules.ps1

      - name: Test capture and tray callback integration
        shell: pwsh
        run: .\test\capture-integration.ps1

      - name: Package portable binaries
        shell: pwsh
        run: .\package.ps1 -Version $env:RELEASE_TAG

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: TrayGroups-${{ env.RELEASE_TAG }}-windows-x64
          path: TrayGroups-${{ env.RELEASE_TAG }}-windows-x64.zip
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TrayGroups ${{ env.RELEASE_TAG }}
          body: |
            Portable Windows release with TrayGroups grouping and scheduled multi-monitor capture in one executable.

            Configuration and screenshot output stay beside the executable. Extract it to a writable folder before running.
          files: TrayGroups-${{ env.RELEASE_TAG }}-windows-x64.zip
          fail_on_unmatched_files: true
          make_latest: true
